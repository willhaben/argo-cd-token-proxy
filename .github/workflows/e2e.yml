name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  token-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: helm/kind-action@v1
        with:
          create_cluster: false

      - name: Run e2e suite
        run: go test -tags e2e -v -count=1 ./test/e2e/
