apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-cd-mcp
  namespace: argo-cd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-cd-token-proxy
  namespace: argo-cd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argo-cd-token-proxy
  template:
    metadata:
      labels:
        app: argo-cd-token-proxy
    spec:
      serviceAccountName: argo-cd-mcp
      automountServiceAccountToken: false
      containers:
        - name: proxy
          image: argo-cd-token-proxy:e2e
          imagePullPolicy: Never
          env:
            - name: ARGOCD_BASE_URL
              value: http://argo-cd-argocd-server.argo-cd.svc.cluster.local
            - name: ARGOCD_DEX_TOKEN_FILE
              value: /var/run/secrets/dex-subject-token/token
            - name: ARGOCD_DEX_CLIENT_ID
              value: argo-cd-cli
            - name: ARGOCD_DEX_CONNECTOR_ID
              value: kubernetes
            - name: ARGOCD_DEX_DEBUG
              value: "true"
          ports:
            - containerPort: 8083
          volumeMounts:
            - name: dex-subject-token
              mountPath: /var/run/secrets/dex-subject-token
              readOnly: true
      volumes:
        - name: dex-subject-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: argo-cd-mcp
                  expirationSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: argo-cd-token-proxy
  namespace: argo-cd
spec:
  selector:
    app: argo-cd-token-proxy
  ports:
    - port: 8083
      targetPort: 8083
